<html>

<head>
    <title>ScrollMaps Test</title>
    <style>
        body {
            display: flex;
            font-family: Arial, Helvetica, sans-serif;
            flex-wrap: wrap;
        }

        body>div {
            flex: 1;
            flex-basis: 300px;
            width: 400px;
            height: 300px;
            border: 1px solid #666;
            display: flex;
            flex-direction: column;
            background: #ccc;
        }

        body>div:hover {
            background: #eee;
        }

        body>div>* {
            width: 100%;
            flex: 1;
        }

        body>div>h5 {
            flex: 0;
            margin: 8px;
        }

        iframe {
            border: none;
        }
    </style>
</head>

<body>
    <script>
        const TEST_PAGES = {
            "Google Maps iframe": "https://www.google.com/maps/embed/v1/place?key=AIzaSyD4iE2xVSpkLLOXoyqT-RuPwURN3ddScAI&q=Space+Needle,Seattle+WA",
            "Google Maps API":
                "https://geo-devrel-javascript-samples.web.app/samples/map-simple/app/dist/",
            "Google Street View":
                "https://geo-devrel-javascript-samples.web.app/samples/streetview-embed/app/dist/",
            "OpenLayers":
                "https://camptocamp.github.io/ngeo/refs/heads/master/examples/control.html",
            // "https://openlayers.org/en/latest/examples/accessible.html"
            "Azure maps":
                "https://samples.azuremaps.com/3d-layer/webgl",
            "MapBox":
                "https://anvaka.github.io/peak-map/#3.7/37.6/105.81",
            // "https://demos.mapbox.com/sf_ships/"
            "ARCGIS":
                "https://www.arcgis.com/apps/webappviewer/index.html?id=6b88d20c300b4991acce07500b89676f",
            "ARCGIS Tile":
                "https://developers.arcgis.com/javascript/latest/demo-apps/demos-homepage-d20b611219347937f637fb1812406f17.html",
            "Apple MapKit":
                "https://vasile.github.io/mapkit-js-demo/map.html",
            "Leaflet":
                "https://leafletjs.com/examples/quick-start/example.html",
            "Leaflet 2":
                "https://developer-applications.myptv.com/Tutorials/MapRendering/Leaflet/index.html",
            "OpenStreetMap":
                "https://harrywood.co.uk/maps/examples/openlayers/simple-marker.html",
            "Mapy.cz":
                "https://en.frame.mapy.cz/s/mohefakesa",
            "Bing map": "https://toslimarif.github.io/ngx-bingmaps/",
        };

        for (const page in TEST_PAGES) {
            const pageUrl = TEST_PAGES[page];
            const container = document.createElement('div');
            const title = document.createElement('h5');
            const link = document.createElement('a');
            link.innerText = page;
            link.href = pageUrl;
            link.target = "_blank";
            title.appendChild(link);
            container.appendChild(title);
            document.body.append(container);

            container.addEventListener('click', () => {
                const iframe = document.createElement('iframe');
                iframe.setAttribute("frameborder", "0");
                iframe.src = pageUrl;
                container.appendChild(iframe);
                container.style.background = "#fff";
            }, { once: true });
        }
    </script>
</body>

</html>
