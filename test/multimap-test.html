<html>

<head>
    <title>ScrollMaps Test</title>
    <style>
        body {
            display: flex;
            font-family: Arial, Helvetica, sans-serif;
            flex-wrap: wrap;
        }

        body>div {
            flex: 1;
            flex-basis: 300px;
            width: 400px;
            height: 300px;
            border: 1px solid #666;
            display: flex;
            flex-direction: column;
        }

        body>div>* {
            width: 100%;
            flex: 1;
        }

        body>div>h5 {
            flex: 0;
            margin: 8px;
        }

        iframe {
            border: none;
        }
    </style>
</head>

<body>
    <div>
        <h5>Google Maps iframe</h5>
        <iframe
            src="https://www.google.com/maps/embed/v1/place?key=AIzaSyD4iE2xVSpkLLOXoyqT-RuPwURN3ddScAI&amp;q=Space+Needle,Seattle+WA"></iframe>
    </div>
    <div>
        <h5>Google Maps API</h5>
        <iframe src="https://geo-devrel-javascript-samples.web.app/samples/map-simple/app/dist/" frameborder="0"></iframe>
    </div>
    <div>
        <h5>OpenLayers</h5>
        <iframe src="https://camptocamp.github.io/ngeo/master/examples/control.html" frameborder="0"></iframe>
        <!-- <iframe src="https://openlayers.org/en/latest/examples/accessible.html" frameborder="0"></iframe> -->
    </div>
    <div>
        <h5>Azure maps</h5>
        <iframe src="https://samples.azuremaps.com/3d-layer/webgl" frameborder="0"></iframe>
    </div>
    <div>
        <h5>MapBox</h5>
        <iframe src="https://anvaka.github.io/peak-map/#7.36/47.538/-123.04" frameborder="0"></iframe>
        <!-- <iframe src="https://demos.mapbox.com/sf_ships/" frameborder="0"></iframe> -->
    </div>
    <div>
        <h5>ARCGIS</h5>
        <iframe src="https://www.arcgis.com/apps/webappviewer/index.html?id=6b88d20c300b4991acce07500b89676f" frameborder="0"></iframe>
    </div>
    <div>
        <h5>Apple MapKit</h5>
        <iframe src="https://vasile.github.io/mapkit-js-demo/map.html" frameborder="0"></iframe>
    </div>
    <div>
        <h5>Leaflet</h5>
        <iframe src="https://leafletjs.com/examples/quick-start/example.html" frameborder="0"></iframe>
    </div>
    <div>
        <h5>OpenStreetMap</h5>
        <iframe src="https://harrywood.co.uk/maps/examples/openlayers/simple-marker.html" frameborder="0"></iframe>
    </div>
</body>

</html>
